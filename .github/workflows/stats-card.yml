name: Generate terminal-framed stats card

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

  push:
    branches:
      - main
    paths-ignore:
      - 'assets/stats.svg'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch languages pie chart
        run: curl -sL -o /tmp/raw-stats.svg "https://stats.pphat.top/languages?username=vitoriaGoncalves08&type=pie"

      - name: Wrap chart in terminal chrome
        run: python scripts/wrap_terminal.py /tmp/raw-stats.svg assets/stats.svg "vitoriaGoncalves08@github: stats"

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg
          git diff --staged --quiet || git commit -m "chore: refresh stats card"
          git push
